:root[data-theme="dark"]{
  --bg:#0B171C; --surface:#12232A; --surface-2:#1A2F37; --ink:#E4EDEF; --ink-2:#A2B5BC; --ink-3:#7C9198; --line:#25404A;
  --accent:#FF7F9C; --accent-soft:#3B1E28; --on-accent:#1A0B10;
  --booked:#62D39E; --booked-soft:#13342A; --tent:#F2B657; --tent-soft:#392A11; --idea:#A3BCD8; --idea-soft:#1C2C3C;
  --due:#FF8C7E; --due-soft:#3E1C18; --dim:#6474B8; --sun:#F0B13A; --night:#22383F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 28px)}

/* Title bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.wordmark .speed{display:inline-flex;flex-direction:column;gap:3px}
.wordmark .speed i{display:block;height:2px;border-radius:2px;background:var(--accent)}
.wordmark .speed i:nth-child(1){width:18px}.wordmark .speed i:nth-child(2){width:13px}.wordmark .speed i:nth-child(3){width:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:16px;height:16px;flex:none}

/* Panels */
.panel{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.h-sec{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h-sec .count{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-3);font-size:12px}
.group{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.fine{font-size:13px;color:var(--ink-3)}
.clocks{display:flex;gap:8px;flex-wrap:wrap}
.clock{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.clock b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:13px}
.preview{font-size:13px;padding:8px 12px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--ink)}

/* Hero (pre-trip) */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:20px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero .lines{position:absolute;right:-10px;top:22px;display:flex;flex-direction:column;gap:7px;opacity:.9}
.hero .lines i{display:block;height:4px;border-radius:4px;background:var(--accent)}
.hero .lines i:nth-child(1){width:120px}.hero .lines i:nth-child(2){width:90px}.hero .lines i:nth-child(3){width:60px}
.hero .n{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em}
.hero .l{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero .route{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;margin-top:10px;opacity:.9}
.hero .hs{font-size:14px;opacity:.85}

/* Deadline */
.due{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--due-soft);color:var(--ink)}
.due .dd{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;padding:5px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.due .dd b{font-family:var(--f-display);font-size:19px;line-height:1;color:var(--due)}
.due .dd span{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--due);margin-top:2px}
.due .dt{min-width:0}
.due .dt strong{display:block;font-weight:600}
.due .dt p{font-size:13px;color:var(--ink-2)}
.due .left{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-size:12px;color:var(--due)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:none}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-booked{background:var(--booked-soft);color:var(--booked)}
.c-tentative{background:var(--tent-soft);color:var(--tent)}
.c-idea{background:transparent;color:var(--idea);box-shadow:inset 0 0 0 1px var(--idea)}
.c-tip{background:var(--surface-2);color:var(--ink-2)}
.c-note{background:var(--surface-2);color:var(--ink-2)}
.c-dropped{background:var(--surface-2);color:var(--ink-3)}
.c-next{background:var(--accent);color:var(--on-accent)}
.c-next::before{display:none}

/* Items (timeline) */
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item.s-tip,.item.s-note{background:transparent;border-style:dashed}
.item.is-next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item>summary,.item>.row{list-style:none;display:grid;grid-template-columns:76px minmax(0,1fr) 18px;gap:10px;padding:12px 12px 12px 14px;cursor:pointer;align-items:start}
.item>.row{cursor:default}
.item>summary::-webkit-details-marker{display:none}
.when{display:flex;flex-direction:column;gap:1px;padding-top:1px;min-width:0}
.when .t{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink)}
.when .t2{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.when .tz{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.what{min-width:0;display:flex;flex-direction:column;gap:3px}
.what .chips{display:flex;gap:6px;flex-wrap:wrap}
.what h3{font-size:16px;font-weight:600;line-height:1.3;text-wrap:balance}
.what .sub{font-size:13.5px;color:var(--ink-2)}
.chev{width:18px;height:18px;color:var(--ink-3);margin-top:2px;transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.more{padding:0 14px 14px calc(14px + 76px + 10px);display:flex;flex-direction:column;gap:12px}
.more ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--accent);text-decoration:none}
.links a svg{width:14px;height:14px}
.place{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.place .pn{font-weight:600;font-size:14px}
.place .pa{font-size:14px;color:var(--ink-2);user-select:all;-webkit-user-select:all}
.place .acts{display:flex;gap:8px;flex-wrap:wrap}
.relto{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:13.5px}
.relto p{min-width:0;flex:1;color:var(--ink-2)}

/* Day strip */
.strip-wrap{margin:0 -16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip-wrap::-webkit-scrollbar{display:none}
.strip{display:flex;gap:8px;padding:2px 16px 6px;width:max-content}
.dchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:54px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.dchip .dw{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.dchip .dn{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.dchip svg{width:18px;height:18px;color:var(--ink-3)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.on .dw,.dchip.on svg{color:var(--bg);opacity:.8}
.dchip .dot{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dhead{display:flex;flex-direction:column;gap:4px}
.dhead h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
.dhead .where{font-size:14px;color:var(--ink-2)}

/* Jet-lag strip (per day) */
.jet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.jet .jicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--dim);color:var(--on-dim)}
.jet .jicon svg{width:16px;height:16px}
.jet p{font-size:13.5px;color:var(--ink-2)}
.jet p b{color:var(--ink);font-weight:600}

/* Plan list (day rows) */
.drows{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.drow:last-child{border-bottom:0}
.drow .db{display:flex;flex-direction:column;align-items:center;line-height:1}
.drow .db span{font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.drow .db b{font-family:var(--f-display);font-weight:700;font-size:21px;margin-top:3px}
.drow .dm{min-width:0}
.drow .dm strong{display:block;font-weight:600;font-size:15px}
.drow .dm span{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dots{display:flex;gap:4px}
.drow .dots i{width:7px;height:7px;border-radius:50%}
.i-booked{background:var(--booked)}.i-tentative{background:var(--tent)}.i-idea{box-shadow:inset 0 0 0 1.5px var(--idea)}
.drow svg.go{width:16px;height:16px;color:var(--ink-3)}

/* To-dos */
.progress{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--booked);border-radius:6px}
.todo{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 14px;align-items:start}
.todo+.todo{border-top:1px solid var(--line)}
.check{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--ink-3);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"]{background:var(--booked);border-color:var(--booked);color:var(--surface)}
.check[aria-pressed="true"] svg{opacity:1}
.todo .tt{font-size:15px}
.todo.done .tt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.todo .tm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.linkish{border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--accent);cursor:pointer}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}

/* Bookings */
.bk{display:flex;flex-direction:column;gap:14px;padding:16px}
.bk header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bk h3{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.bk .dates{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.leg{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.leg .lt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.leg .fl{font-family:var(--f-mono);font-weight:600;font-size:13px}
.leg .nt{font-size:12px;color:var(--ink-3);text-align:right}
.leg .lr{display:grid;grid-template-columns:auto minmax(20px,1fr) auto;gap:10px;align-items:center}
.leg .ap{display:flex;flex-direction:column;line-height:1.1}
.leg .ap.r{text-align:right}
.leg .ap b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em}
.leg .ap span{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.leg .ln{position:relative;height:1px;background:var(--ink-3);opacity:.6}
.leg .ln svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);width:16px;height:16px;background:var(--surface-2);color:var(--ink-2);opacity:1}
.fields{display:grid;grid-template-columns:minmax(0,1fr);margin:0;border-top:1px solid var(--line)}
.f{display:grid;grid-template-columns:minmax(84px,30%) minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.f dt{font-size:13px;color:var(--ink-3)}
.f dd{margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.f .v{min-width:0;overflow-wrap:anywhere;font-size:14.5px;user-select:all;-webkit-user-select:all}
.f .v.mono{font-size:13.5px;font-weight:500}
.f .fa{display:flex;gap:6px;flex:none}
.icbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);text-decoration:none;padding:0}
.icbtn svg{width:15px;height:15px}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2)}

/* Jet-lag chart */
.jchart{display:flex;flex-direction:column;gap:14px;padding:16px}
.jaxis{position:relative;height:16px;margin-bottom:-6px}
.jaxis span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.jrow{display:flex;flex-direction:column;gap:6px}
.jrow .jl{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.jrow .jl b{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.jrow.is-today .jl b{color:var(--accent)}
.jbar{position:relative;height:16px;border-radius:5px;background:var(--night);overflow:hidden}
.jbar .seg{position:absolute;top:0;bottom:0}
.jbar .dimseg{background:var(--dim)}
.jbar .sunseg{background:var(--sun)}
.jbar .bed{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.jrow.is-today .jbar{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px}
.prose{font-size:15px;color:var(--ink-2);max-width:62ch}
.list{margin:0;padding:14px 16px 14px 32px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--ink-2)}

/* More / other options */
.opt{display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.opt+.opt{border-top:1px solid var(--line)}
.opt .ot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt .ot strong{font-weight:600}
.opt p{font-size:13.5px;color:var(--ink-2)}
.opt.dropped strong{color:var(--ink-3)}

/* Field notes, jump row, reference, ethos */
.f .vw{min-width:0;display:flex;flex-direction:column;gap:2px}
.f .fn{font-size:12.5px;line-height:1.35;color:var(--ink-3)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:32px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.bk{scroll-margin-top:72px}
.ref{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.ref>p{font-size:14.5px;color:var(--ink-2)}
.ref ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px;color:var(--ink-2)}
.ref ul b,.list b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:8px 6px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{font-size:12px;font-weight:600;color:var(--ink-3)}
.tbl tbody th{font-weight:500;color:var(--ink-2);min-width:110px}
.tbl td{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0;font-weight:600;color:var(--ink)}
.ethos{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--surface-2)}
.ethos h2{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ethos p{font-size:14.5px;color:var(--ink)}

/* Stay card */
.stay{display:flex;flex-direction:column;gap:10px;padding:14px}

/* Empty state (offline app before import) */
.empty{display:flex;flex-direction:column;gap:12px;padding:22px 18px;text-align:left}
.empty h2{font-family:var(--f-display);font-weight:700;font-size:24px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative;padding:0}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-family:var(--f-mono);display:grid;place-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:22px}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .stat{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.sheet .stat i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sheet .stat i.ok{background:var(--booked)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="topbar">
    <div class="wordmark"><span class="speed" aria-hidden="true"><i></i><i></i><i></i></span><span>Florida 26</span></div>
    <button class="btn sm" data-act="open-sheet" id="sheet-btn"></button>
  </header>
  <main>
    <section class="panel" id="p-today" role="tabpanel" aria-labelledby="t-today"></section>
    <section class="panel" id="p-days" role="tabpanel" aria-labelledby="t-days" hidden></section>
    <section class="panel" id="p-bookings" role="tabpanel" aria-labelledby="t-bookings" hidden></section>
    <section class="panel" id="p-jetlag" role="tabpanel" aria-labelledby="t-jetlag" hidden></section>
    <section class="panel" id="p-todo" role="tabpanel" aria-labelledby="t-todo" hidden></section>
  </main>
</div>
<nav class="tabbar" aria-label="Sections"><div class="in" role="tablist" id="tabs"></div></nav>
<div class="scrim" id="scrim" data-act="close-sheet" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-file" class="vh" accept="application/json,.json,text/plain" tabindex="-1" aria-hidden="true">

<script id="trip-data" type="application/json">null</script>
<script>
(function(){
"use strict";
var BUILD = "offline";
var LS_CHECKS = "ft-checks-v1", LS_DATA = "ft-data-v1", LS_UI = "ft-ui-v1";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function parse(s){try{return JSON.parse(s);}catch(e){return null;}}

/* ---------- state ---------- */
var pack = null;            // {updated, trip, checks}
var checks = {};            // {id:{done,at}}
var importedAt = null;
var syncMode = BUILD === "artifact" ? "local" : "device";
var dbRef = null;
var swReady = false;
var ui = {tab:"today", day:null, open:{}};
var sim = null;

function validPack(p){return p && p.app === "florida-trip" && p.trip && Array.isArray(p.trip.days) && p.trip.days.length > 0;}
function mergeChecks(a,b){
  var out = {}, k;
  a = a || {}; b = b || {};
  for (k in a) out[k] = a[k];
  for (k in b) { if (!out[k] || (b[k] && b[k].at && (!out[k].at || b[k].at > out[k].at))) out[k] = b[k]; }
  return out;
}

var embedded = parse(document.getElementById("trip-data").textContent);
if (BUILD === "artifact") {
  pack = validPack(embedded) ? embedded : null;
  checks = mergeChecks(pack ? pack.checks : {}, parse(lsGet(LS_CHECKS)) || {});
} else {
  var stored = parse(lsGet(LS_DATA));
  if (validPack(stored)) { pack = stored; checks = stored.checks || {}; importedAt = stored.importedAt || null; }
}
var savedUi = parse(lsGet(LS_UI));
if (savedUi) { if (savedUi.tab) ui.tab = savedUi.tab; if (savedUi.day) ui.day = savedUi.day; }

/* ---------- helpers ---------- */
function esc(s){return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function pd(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function now(){return sim ? new Date(sim.getTime()) : new Date();}
function todayIso(){return iso(now());}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function fmtShort(s){var d=pd(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function fmtStamp(s){if(!s)return "";var d=new Date(s);if(isNaN(d))return s;var h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");return d.getDate()+" "+MON[d.getMonth()]+", "+((h%12)||12)+":"+m+(h<12?"am":"pm");}
function trip(){return pack.trip;}
function dayById(id){var ds=trip().days;for(var i=0;i<ds.length;i++)if(ds[i].id===id)return ds[i];return null;}
function dayByDate(s){var ds=trip().days;for(var i=0;i<ds.length;i++)if(ds[i].date===s)return ds[i];return null;}
function findItem(id){var ds=trip().days;for(var i=0;i<ds.length;i++)for(var j=0;j<ds[i].items.length;j++)if(ds[i].items[j].id===id)return {day:ds[i],item:ds[i].items[j]};return null;}
function bookingById(id){var b=trip().bookings;for(var i=0;i<b.length;i++)if(b[i].id===id)return b[i];return null;}
function todoById(id){var t=trip().todos;for(var i=0;i<t.length;i++)if(t[i].id===id)return t[i];return null;}
function isDone(id){return !!(checks[id] && checks[id].done);}
function openTodos(){return trip().todos.filter(function(t){return !isDone(t.id);});}
function mapsUrl(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);}
function phase(){var t=todayIso(),ds=trip().days;if(t<ds[0].date)return "before";if(t>ds[ds.length-1].date)return "after";return "during";}

var ICONS = {
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
  days:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  bookings:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v1.8a2.2 2.2 0 0 0 0 4.4v1.8A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5v-1.8a2.2 2.2 0 0 0 0-4.4z"/><path d="M14.5 5.5v12" stroke-dasharray="2 2"/>',
  jetlag:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  todo:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.3l2.7 2.7L16.2 9"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  go:'<path d="M9 6l6 6-6 6"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
  map:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  phone:'<path d="M5 4h3.5l1.6 4-2.1 1.3a11 11 0 0 0 6.7 6.7l1.3-2.1 4 1.6V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/>',
  ext:'<path d="M14 4.5h5.5V10M19.5 4.5L11 13M17 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1H10"/>',
  plane:'<path d="M10.5 21l1.5-1v-5.5l8 2.5v-2l-8-5V4.5a1.5 1.5 0 0 0-3 0V10l-8 5v2l8-2.5V20l1.5 1z" transform="translate(1.5 0)"/>',
  check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  offline:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
  data:'<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>',
  more:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>',
  moon:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>'
};
function icon(n,cls){return '<svg class="'+(cls||"")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}
var LABEL = {booked:"Booked",tentative:"Tentative",idea:"Idea",tip:"Tip",note:"Note",dropped:"Dropped"};
function chip(s){return '<span class="chip c-'+s+'">'+LABEL[s]+'</span>';}

/* ---------- components ---------- */
function placeHtml(p){
  return '<div class="place"><div><div class="pn">'+esc(p.name)+'</div><div class="pa">'+esc(p.address)+'</div></div>'+
    '<div class="acts"><button class="btn sm" data-copy="'+esc(p.address)+'" data-copy-label="Address">'+icon("copy")+'Copy</button>'+
    '<a class="btn sm" href="'+esc(mapsUrl(p.address))+'" target="_blank" rel="noopener">'+icon("map")+'Map</a></div></div>';
}
function todoRow(t){
  var it = t.item ? findItem(t.item) : null;
  return '<div class="todo'+(isDone(t.id)?" done":"")+'"><button class="check" data-toggle="'+esc(t.id)+'" aria-pressed="'+isDone(t.id)+'" aria-label="Mark done: '+esc(t.text)+'">'+icon("check")+'</button>'+
    '<div><p class="tt">'+esc(t.text)+'</p>'+
    ((t.when||t.optional||it)?'<p class="tm">'+(t.when?'<span class="tag">'+esc(t.when)+'</span>':"")+(t.optional?'<span class="tag">Optional</span>':"")+(it?'<button class="linkish" data-goto-item="'+esc(t.item)+'">'+esc(fmtShort(it.day.date))+' plan</button>':"")+'</p>':"")+
    '</div></div>';
}
function itemHtml(it, nextId, scope){
  var iid = (scope||"d")+"-item-"+it.id;
  var more = (it.body&&it.body.length)||it.place||(it.places&&it.places.length)||(it.links&&it.links.length)||it.todo;
  var inner =
    '<div class="when"><span class="t">'+esc(it.time||"·")+'</span>'+(it.end?'<span class="t2">to '+esc(it.end)+'</span>':"")+(it.tz?'<span class="tz">'+esc(it.tz)+'</span>':"")+'</div>'+
    '<div class="what"><div class="chips">'+chip(it.status)+(nextId===it.id?'<span class="chip c-next">Next</span>':"")+'</div><h3>'+esc(it.title)+'</h3>'+(it.sub?'<p class="sub">'+esc(it.sub)+'</p>':"")+'</div>';
  var cls = 'item s-'+it.status+(nextId===it.id?" is-next":"");
  if (!more) return '<div class="'+cls+'" id="'+esc(iid)+'"><div class="row">'+inner+'<span></span></div></div>';
  var body = '';
  if (it.body && it.body.length) body += '<ul>'+it.body.map(function(b){return '<li>'+esc(b)+'</li>';}).join("")+'</ul>';
  if (it.place) body += placeHtml(it.place);
  (it.places||[]).forEach(function(p){ body += placeHtml(p); });
  if (it.links && it.links.length) body += '<div class="links">'+it.links.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+icon("ext")+esc(l.label)+'</a>';}).join("")+'</div>';
  if (it.todo) { var t = todoById(it.todo); if (t) body += '<div class="relto"><button class="check" style="flex:none" data-toggle="'+esc(t.id)+'" aria-pressed="'+isDone(t.id)+'" aria-label="Mark done">'+icon("check")+'</button><p>'+(isDone(t.id)?'Done: ':'To do: ')+esc(t.text)+'</p></div>'; }
  return '<details class="'+cls+'" id="'+esc(iid)+'" data-id="'+esc(it.id)+'"'+(ui.open[it.id]?" open":"")+'><summary>'+inner+icon("chev","chev")+'</summary><div class="more">'+body+'</div></details>';
}
function jetHtml(d){
  var j = d.jet, txt;
  if (d.jetText) txt = esc(d.jetText);
  else if (j) txt = 'Keep light low until <b>'+esc(j.dimUntil)+'</b>, then <b>'+esc(j.bright.charAt(0).toLowerCase()+j.bright.slice(1))+'</b>. Bed about 10pm.';
  else return "";
  return '<div class="jet"><span class="jicon">'+icon("moon")+'</span><p><b>Jet lag:</b> '+txt+'</p></div>';
}
function liB(t){var m=/^([^:]{2,38}):\s(.+)$/.exec(t);return '<li>'+(m?'<b>'+esc(m[1])+':</b> '+esc(m[2]):esc(t))+'</li>';}
function linksHtml(ls){return (ls&&ls.length)?'<div class="links">'+ls.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+icon("ext")+esc(l.label)+'</a>';}).join("")+'</div>':"";}
function refHtml(r){
  var h = '<div class="group"><h2 class="h-sec">'+esc(r.title)+'</h2><div class="card ref">';
  (r.text||[]).forEach(function(t){ h += '<p>'+esc(t)+'</p>'; });
  if (r.bullets) h += '<ul>'+r.bullets.map(liB).join("")+'</ul>';
  if (r.table) h += '<div class="tbl"><table><thead><tr>'+r.table.head.map(function(c){return '<th scope="col">'+esc(c)+'</th>';}).join("")+'</tr></thead><tbody>'+
    r.table.rows.map(function(row){return '<tr>'+row.map(function(c,i){return i===0?'<th scope="row">'+esc(c)+'</th>':'<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';
  if (r.note) h += '<p class="fine">'+esc(r.note)+'</p>';
  return h + linksHtml(r.links) + '</div></div>';
}
function dayLabel(d){var x=pd(d.date);return DOWL[x.getDay()]+" "+x.getDate()+" "+MONL[x.getMonth()];}
function nextItemId(day){
  if (day.date !== todayIso()) return null;
  var n = now(), m = n.getHours()*60+n.getMinutes(), best = null;
  day.items.forEach(function(it){ if (typeof it.start === "number" && it.start >= m - 15 && (!best || it.start < best.start)) best = it; });
  return best ? best.id : null;
}
function dayHtml(d, scope){
  var idx = trip().days.indexOf(d)+1, nid = nextItemId(d);
  return '<div class="dhead"><p class="eyebrow">Day '+idx+' of '+trip().days.length+'</p><h2>'+esc(d.title)+'</h2><p class="where">'+esc(dayLabel(d))+' · '+esc(d.where)+'</p></div>'+
    jetHtml(d)+'<div class="items">'+d.items.map(function(it){return itemHtml(it,nid,scope);}).join("")+'</div>';
}
function dueHtml(dl){
  var d = pd(dl.date), left = diffDays(todayIso(), dl.date);
  if (left < 0) return "";
  return '<div class="due"><div class="dd"><b>'+d.getDate()+'</b><span>'+MON[d.getMonth()]+'</span></div><div class="dt"><strong>'+esc(dl.title)+'</strong><p>'+esc(dl.text)+'</p><span class="left">'+(left===0?"Today":left===1?"Tomorrow":left+" days left")+'</span></div></div>';
}
function ethosHtml(e){return '<section class="ethos"><h2>'+esc(e.title)+'</h2><p>'+esc(e.text)+'</p></section>';}
function stayCard(d){
  var map = {sentral:"b-sentral", eau:"b-eau"}, b = d.stay ? bookingById(map[d.stay]) : null;
  if (!b) return "";
  var conf = b.fields.filter(function(f){return f.label==="Confirmation";})[0], ph = b.fields.filter(function(f){return f.label==="Phone";})[0];
  return '<div class="group"><h2 class="h-sec">Tonight</h2><div class="card stay"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong style="font-size:16px">'+esc(b.title)+'</strong><button class="linkish" data-goto-bk="'+b.id+'">Booking</button></div>'+
    placeHtml(b.place)+'<dl class="fields" style="border-top:0">'+[conf,ph].filter(Boolean).map(fieldHtml).join("")+'</dl></div></div>';
}
function fieldHtml(f){
  return '<div class="f"><dt>'+esc(f.label)+'</dt><dd><span class="vw"><span class="v'+(f.copy?" mono":"")+'">'+esc(f.value)+'</span>'+(f.note?'<small class="fn">'+esc(f.note)+'</small>':"")+'</span>'+
    ((f.copy||f.tel)?'<span class="fa">'+(f.tel?'<a class="icbtn" href="tel:'+esc(f.tel)+'" aria-label="Call '+esc(f.value)+'">'+icon("phone")+'</a>':"")+(f.copy?'<button class="icbtn" data-copy="'+esc(f.value)+'" data-copy-label="'+esc(f.label)+'" aria-label="Copy '+esc(f.label)+'">'+icon("copy")+'</button>':"")+'</span>':"")+
    '</dd></div>';
}

/* ---------- panels ---------- */
function clocksHtml(){
  return '<div class="clocks" id="clocks">'+clockBits()+'</div>';
}
function tzTime(tz){
  try{
    var p = new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",hour:"numeric",minute:"2-digit",hour12:true}).formatToParts(new Date());
    var o = {}; p.forEach(function(x){o[x.type]=x.value;});
    return o.weekday+" "+o.hour+":"+o.minute+(o.dayPeriod||"").toLowerCase();
  }catch(e){return null;}
}
function clockBits(){
  var mia = tzTime("America/New_York"), cns = tzTime("Australia/Brisbane");
  if (!mia || !cns) return "";
  return '<span class="clock">Miami <b>'+esc(mia)+'</b></span><span class="clock">Cairns <b>'+esc(cns)+'</b></span>';
}
function renderToday(){
  var el = document.getElementById("p-today"), h = "", t = trip(), ph = phase();
  if (sim) h += '<p class="preview">Previewing '+esc(fmtShort(todayIso()))+'. Remove the link\'s #sim part to return to today.</p>';
  h += clocksHtml();
  if (ph === "before") {
    var n = diffDays(todayIso(), t.days[0].date);
    h += '<section class="hero"><div class="lines" aria-hidden="true"><i></i><i></i><i></i></div><span class="n">'+n+'</span><span class="l">'+(n===1?"day":"days")+' to go</span><p class="route">CNS → BNE → LAX → MIA</p><p class="hs">'+esc(fmtShort(t.days[0].date))+' · QF1881 leaves Cairns 9:15am</p></section>';
    var dues = t.deadlines.map(dueHtml).join("");
    if (dues) h += '<div class="group"><h2 class="h-sec">Deadline</h2>'+dues+'</div>';
    var open = openTodos(), done = t.todos.length - open.length;
    h += '<div class="group"><h2 class="h-sec">Before you fly <span class="count">'+done+' of '+t.todos.length+' done</span></h2><div class="progress"><i style="width:'+Math.round(done/t.todos.length*100)+'%"></i></div>'+
      (open.length?'<div class="card">'+open.slice(0,3).map(todoRow).join("")+'</div>':'<p class="fine">All done.</p>')+
      (open.length>3?'<button class="btn" data-tab="todo">All to-dos'+icon("go")+'</button>':"")+'</div>';
    if (t.ethos) h += ethosHtml(t.ethos);
  } else if (ph === "during") {
    var d = dayByDate(todayIso());
    h += dayHtml(d,"t") + stayCard(d);
    if (t.ethos && d.stay === "sentral") h += ethosHtml(t.ethos);
  } else {
    h += '<div class="card empty"><h2>Home again</h2><p class="prose">You landed in Cairns on Sun 15 Nov. The whole plan is still under Days.</p></div>';
  }
  if (ph !== "during") {
    h += '<div class="group"><h2 class="h-sec">The plan</h2><div class="card" style="padding:2px 12px">'+'<div class="drows">'+t.days.map(function(d){
      var c = {booked:0,tentative:0,idea:0}; d.items.forEach(function(i){ if (c[i.status]!==undefined) c[i.status]++; });
      var dots = ""; ["booked","tentative","idea"].forEach(function(s){ for (var k=0;k<Math.min(c[s],4);k++) dots += '<i class="i-'+s+'"></i>'; });
      var x = pd(d.date);
      return '<button class="drow" data-goto-day="'+d.id+'"><span class="db"><span>'+DOW[x.getDay()]+'</span><b>'+x.getDate()+'</b></span><span class="dm"><strong>'+esc(d.title)+'</strong><span>'+esc(d.where)+'</span></span><span style="display:flex;gap:8px;align-items:center"><span class="dots">'+dots+'</span>'+icon("go","go")+'</span></button>';
    }).join("")+'</div></div><p class="fine">Dots: <span style="color:var(--booked)">booked</span>, <span style="color:var(--tent)">tentative</span>, <span style="color:var(--idea)">idea</span>.</p></div>';
  }
  el.innerHTML = h;
}
function renderDays(){
  var el = document.getElementById("p-days"), t = trip(), sel = ui.day;
  if (sel !== "more" && !dayById(sel)) sel = ui.day = (phase()==="during" ? dayByDate(todayIso()).id : t.days[0].id);
  var strip = t.days.map(function(d){
    var x = pd(d.date), isT = d.date === todayIso(), air = d.id === "d14";
    return '<button class="dchip'+(sel===d.id?" on":"")+'" data-day="'+d.id+'" aria-pressed="'+(sel===d.id)+'" aria-label="'+esc(dayLabel(d))+'"><span class="dw">'+DOW[x.getDay()]+'</span>'+(air?icon("plane"):'<span class="dn">'+x.getDate()+'</span>')+(isT?'<span class="dot"></span>':"")+'</button>';
  }).join("") + '<button class="dchip'+(sel==="more"?" on":"")+'" data-day="more" aria-pressed="'+(sel==="more")+'" aria-label="Other options"><span class="dw">More</span>'+icon("more")+'</button>';
  var body;
  if (sel === "more") {
    var bike = '<div class="group"><h2 class="h-sec">Getting around by bike</h2><div class="card"><ul class="list"><li>Monday\'s ride uses Citi Bike (4-hour pass about $18), so no hire is needed.</li><li>Set up the Citi Bike app before you go and check the map for docks near the hotel; sources disagree on coverage in Wynwood.</li></ul></div></div>';
    body = '<div class="dhead"><p class="eyebrow">Reference</p><h2>Getting around & other options</h2><p class="where">Commute options, costs and ideas not on the schedule</p></div>'+
      (t.reference ? t.reference.map(refHtml).join("") : bike)+
      '<div class="group"><h2 class="h-sec">Other options</h2><div class="card">'+t.more.map(function(o){return '<div class="opt'+(o.status==="dropped"?" dropped":"")+'"><div class="ot">'+chip(o.status)+'<strong>'+esc(o.title)+'</strong></div><p>'+esc(o.text)+'</p>'+(o.url?'<div class="links"><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+icon("ext")+'Link</a></div>':"")+'</div>';}).join("")+'</div></div>';
  } else body = dayHtml(dayById(sel),"d");
  el.innerHTML = '<div class="strip-wrap"><div class="strip" role="group" aria-label="Choose a day">'+strip+'</div></div>'+body;
  var on = el.querySelector(".dchip.on"); if (on && on.scrollIntoView) { try { on.scrollIntoView({block:"nearest",inline:"center"}); } catch(e){} }
}
function renderBookings(){
  var el = document.getElementById("p-bookings"), KIND = {flight:"Flights",hotel:"Hotel",docs:"Reference"};
  el.innerHTML = '<nav class="jump" aria-label="Jump to a booking">'+trip().bookings.map(function(b){return '<button class="jbtn" data-goto-bk="'+esc(b.id)+'">'+esc(b.short||b.title)+'</button>';}).join("")+'</nav>' + trip().bookings.map(function(b){
    var h = '<article class="card bk" id="bk-'+b.id+'"><header><div><p class="eyebrow">'+esc(b.label||KIND[b.kind])+'</p><h3>'+esc(b.title)+'</h3>'+(b.dates?'<p class="dates">'+esc(b.dates)+'</p>':"")+'</div>'+((b.kind!=="docs"||b.chip)?chip(b.status):"")+'</header>';
    if (b.deadline) h += dueHtml({date:b.deadline.date,title:"Free cancellation ends "+fmtShort(b.deadline.date),text:"After that, 50% of the stay is forfeited."});
    if (b.legs) h += b.legs.map(function(l){return '<div class="leg"><div class="lt"><span class="fl">'+esc(l.flight)+'</span><span class="nt">'+esc(l.note)+'</span></div><div class="lr"><div class="ap"><b>'+esc(l.from)+'</b><span>'+esc(l.dep)+'</span></div><div class="ln">'+icon("plane")+'</div><div class="ap r"><b>'+esc(l.to)+'</b><span>'+esc(l.arr)+'</span></div></div></div>';}).join("");
    if (b.place) h += placeHtml(b.place);
    if (b.fields) h += '<dl class="fields">'+b.fields.map(fieldHtml).join("")+'</dl>';
    if (b.notes) h += '<ul class="notes">'+b.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join("")+'</ul>';
    return h + linksHtml(b.links) + '</article>';
  }).join("");
}
function renderJetlag(){
  var el = document.getElementById("p-jetlag"), j = trip().jetlag, S = 300, E = 1380;
  function pct(m){return ((m-S)/(E-S)*100).toFixed(2)+"%";}
  var axis = [[360,"6a"],[540,"9a"],[720,"12p"],[900,"3p"],[1080,"6p"],[1260,"9p"]].map(function(a){return '<span style="left:'+pct(a[0])+'">'+a[1]+'</span>';}).join("");
  var rows = trip().days.filter(function(d){return d.jet;}).map(function(d){
    var x = pd(d.date), jj = d.jet, isT = d.date === todayIso();
    return '<div class="jrow'+(isT?" is-today":"")+'"><div class="jl"><b>'+DOW[x.getDay()]+' '+x.getDate()+'</b><span>Low until '+esc(jj.dimUntil)+'</span></div>'+
      '<div class="jbar" role="img" aria-label="'+esc(DOW[x.getDay()]+" "+x.getDate()+": keep light low until "+jj.dimUntil+", then "+jj.bright)+'"><span class="seg dimseg" style="left:0;width:'+pct(jj.dimMin)+'"></span><span class="seg sunseg" style="left:'+pct(jj.dimMin)+';width:calc('+pct(jj.brightEndMin)+' - '+pct(jj.dimMin)+')"></span><span class="bed" style="left:'+pct(1320)+'"></span></div>'+
      '<p class="fine">Then: '+esc(jj.bright)+'</p></div>';
  }).join("");
  el.innerHTML = '<div class="dhead"><p class="eyebrow">Cairns → Miami · 15 hours</p><h2>Jet lag plan</h2></div><p class="prose">'+esc(j.intro)+'</p>'+
    '<div class="card jchart"><div class="jaxis" aria-hidden="true">'+axis+'</div>'+rows+
    '<div class="legend"><span><i style="background:var(--dim)"></i>Keep light low</span><span><i style="background:var(--sun)"></i>Bright light</span><span><i style="background:var(--ink);width:2px;height:12px;border-radius:0"></i>Bed ~10pm</span></div></div>'+
    '<div class="group"><h2 class="h-sec">On the way · Sat 7 Nov</h2><div class="card"><ul class="list">'+j.flight.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div></div>'+
    '<div class="group"><h2 class="h-sec">Every day</h2><div class="card"><ul class="list">'+j.tips.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div></div>'+
    (j.home?'<div class="group"><h2 class="h-sec">Coming home</h2><p class="prose">'+esc(j.home.intro)+'</p><div class="card"><ul class="list">'+j.home.tips.map(liB).join("")+'</ul></div></div>':"");
}
function renderTodo(){
  var el = document.getElementById("p-todo"), t = trip(), open = openTodos(), done = t.todos.length - open.length;
  var dues = t.deadlines.map(dueHtml).join("");
  var note = BUILD === "artifact" ? (syncMode === "account" ? "Ticks are saved to your account and go into the offline data file." : "Ticks are saved in this browser.") : "Ticks are saved on this phone. Export a backup from Trip data.";
  el.innerHTML = '<div class="dhead"><p class="eyebrow">Before you fly</p><h2>To-do</h2></div>'+
    (dues?'<div class="group"><h2 class="h-sec">Deadlines</h2>'+dues+'<p class="fine">'+esc(t.deadlineNote)+'</p></div>':"")+
    '<div class="group"><h2 class="h-sec">Checklist <span class="count">'+done+' of '+t.todos.length+' done</span></h2><div class="progress"><i style="width:'+Math.round(done/t.todos.length*100)+'%"></i></div><div class="card">'+t.todos.map(todoRow).join("")+'</div><p class="fine" id="sync-note">'+esc(note)+'</p></div>';
}
function renderTabs(){
  var tabs = [["today","Today"],["days","Days"],["bookings","Bookings"],["jetlag","Jet lag"],["todo","To-do"]];
  var openN = pack ? openTodos().length : 0;
  document.getElementById("tabs").innerHTML = tabs.map(function(t){
    return '<button class="tab" role="tab" id="t-'+t[0]+'" aria-controls="p-'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'" data-tab="'+t[0]+'">'+icon(t[0])+'<span>'+t[1]+'</span>'+(t[0]==="todo"&&openN&&phase()==="before"?'<span class="badge">'+openN+'</span>':"")+'</button>';
  }).join("");
  ["today","days","bookings","jetlag","todo"].forEach(function(n){ document.getElementById("p-"+n).hidden = ui.tab !== n; });
}
function renderEmpty(){
  var h = '<div class="card empty"><p class="eyebrow">Offline trip app</p><h2>Import your trip file</h2><p class="prose">This app keeps your trip on this phone so it works with no signal. Load it once from the data file.</p>'+
    '<ol class="steps"><li>In the Florida 2026 artifact, tap Offline, then Get latest data, and save the file.</li><li>Tap Import below and pick that file.</li></ol>'+
    '<div class="acts" style="display:flex;gap:10px"><label class="btn primary" for="import-file">'+icon("data")+'Import trip file</label></div></div>';
  ["today","days","bookings","jetlag","todo"].forEach(function(n){ document.getElementById("p-"+n).innerHTML = h; });
}
function renderAll(){
  document.getElementById("sheet-btn").innerHTML = BUILD === "artifact" ? icon("offline")+"Offline" : icon("data")+"Trip data";
  renderTabs();
  if (!pack) { renderEmpty(); return; }
  renderToday(); renderDays(); renderBookings(); renderJetlag(); renderTodo();
}

/* ---------- sheet ---------- */
function sheetHtml(){
  var h = '<div class="grab"></div>';
  if (BUILD === "artifact") {
    h += '<h2 id="sheet-title">Offline app</h2><p class="prose">Your Home Screen app works with no signal. It reads a data file you save from here.</p>'+
      '<div class="acts"><button class="btn primary" data-act="get-data">'+icon("offline")+'Get latest data</button></div>'+
      '<p class="fine">Trip data updated '+esc(pack?fmtShort(pack.updated):"")+'. The file includes your ticks.</p>'+
      '<ol class="steps"><li>Tap Get latest data and save the file to Files.</li><li>Open the Florida app on your Home Screen.</li><li>Tap Trip data, then Import, and pick the file.</li></ol>';
  } else {
    h += '<h2 id="sheet-title">Trip data</h2>'+
      '<p class="stat"><i class="'+(pack?"ok":"")+'"></i>'+(pack?'Trip data from '+esc(fmtShort(pack.updated))+(importedAt?' · imported '+esc(fmtStamp(importedAt)):""):"No trip data on this phone yet")+'</p>'+
      '<p class="stat"><i class="'+(swReady?"ok":"")+'"></i>'+(swReady?"Ready to work offline":"Open once with a connection to make it work offline")+'</p>'+
      '<div class="acts"><label class="btn primary" for="import-file">'+icon("data")+'Import trip file</label>'+(pack?'<button class="btn" data-act="export">'+icon("offline")+'Export backup</button>':"")+'</div>'+
      '<p class="fine">Import a newer file whenever plans change. Your ticks are kept. Export saves the trip and your ticks as one file, so you can restore it if this app\'s data is ever cleared.</p>';
  }
  return h + '<button class="btn" data-act="close-sheet">Close</button>';
}
function openSheet(){var s=document.getElementById("sheet");s.innerHTML=sheetHtml();s.hidden=false;document.getElementById("scrim").hidden=false;}
function closeSheet(){document.getElementById("sheet").hidden=true;document.getElementById("scrim").hidden=true;}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2400);}

/* ---------- checks persistence ---------- */
var writing = false, dirty = false;
function persistChecks(){
  if (BUILD === "artifact") {
    lsSet(LS_CHECKS, JSON.stringify(checks));
    if (dbRef) flushDb();
  } else if (pack) {
    pack.checks = checks; lsSet(LS_DATA, JSON.stringify(pack));
  }
}
function flushDb(){
  dirty = true; if (writing) return; writing = true;
  (function loop(){
    if (!dirty || !dbRef) { writing = false; return; }
    dirty = false;
    dbRef.set({checks: checks, updatedAt: new Date().toISOString()}).then(loop, function(e){
      writing = false;
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbRef = null; syncMode = "local"; if (pack) renderTodo(); }
    });
  })();
}
function toggle(id){
  var d = !isDone(id); checks[id] = {done:d, at:new Date().toISOString()};
  persistChecks(); renderTabs(); renderToday(); renderDays(); renderTodo();
  toast(d ? "Marked done" : "Marked not done");
}

/* ---------- data file in/out ---------- */
function exportPack(){
  return JSON.stringify({app:"florida-trip",format:1,updated:pack.updated,trip:pack.trip,checks:checks,exportedAt:new Date().toISOString()}, null, 1);
}
function getLatestData(){
  if (!(window.claude && window.claude.use)) { toast("Saving files isn't available here"); return; }
  window.claude.use("downloads").then(function(dl){
    if (!dl) { toast("Saving files isn't available in this view"); return; }
    return dl.save({filename:"florida-trip-data.json", data:exportPack()}).then(function(r){
      toast(r && r.status === "delivered" ? "Sent" : "Saved. Now Import it in the offline app");
    }, function(e){
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "A save is already open" : "Couldn't save the file here");
    });
  });
}
function exportBackup(){
  var name = "florida-trip-backup-"+iso(new Date())+".json", text = exportPack();
  var file = null; try { file = new File([text], name, {type:"application/json"}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:"Florida trip backup"}).then(function(){toast("Backup shared");}, function(){});
    return;
  }
  var url = URL.createObjectURL(new Blob([text],{type:"application/json"})), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);}, 4000);
  toast("Backup saved");
}
function importFile(f){
  var r = new FileReader();
  r.onload = function(){
    var p = parse(r.result);
    if (!validPack(p)) { toast("That file isn't a Florida trip data file"); return; }
    var merged = mergeChecks(checks, p.checks || {});
    pack = {app:"florida-trip",format:1,updated:p.updated,trip:p.trip,checks:merged,importedAt:new Date().toISOString()};
    checks = merged; importedAt = pack.importedAt;
    var ok = lsSet(LS_DATA, JSON.stringify(pack));
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    closeSheet(); renderAll();
    toast(ok ? "Imported trip data from "+fmtShort(p.updated) : "Imported, but this phone wouldn't store it");
  };
  r.onerror = function(){ toast("Couldn't read that file"); };
  r.readAsText(f);
}

/* ---------- navigation ---------- */
function saveUi(){lsSet(LS_UI, JSON.stringify({tab:ui.tab, day:ui.day}));}
function setTab(t){ui.tab=t;saveUi();renderTabs();window.scrollTo(0,0);}
function gotoDay(id){ui.day=id;saveUi();renderDays();setTab("days");}
function gotoItem(id){var f=findItem(id);if(!f)return;ui.open[id]=true;ui.day=f.day.id;saveUi();renderDays();setTab("days");
  var el=document.getElementById("d-item-"+id);if(el&&el.scrollIntoView){try{el.scrollIntoView({block:"center"});}catch(e){}}}
function gotoBooking(id){setTab("bookings");var el=document.getElementById("bk-"+id);if(el&&el.scrollIntoView){try{el.scrollIntoView({block:"start"});}catch(e){}}}
function copyText(txt,label){
  function fallback(){ toast("Copy not available: press and hold the text to copy"); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){toast((label||"Text")+" copied");}, fallback);
    else fallback();
  } catch(e){ fallback(); }
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-tab],[data-day],[data-goto-day],[data-goto-item],[data-goto-bk],[data-toggle],[data-copy],[data-act]");
  if (!el) return;
  if (el.hasAttribute("data-toggle")) { e.preventDefault(); toggle(el.getAttribute("data-toggle")); return; }
  if (el.hasAttribute("data-copy")) { e.preventDefault(); copyText(el.getAttribute("data-copy"), el.getAttribute("data-copy-label")); return; }
  if (el.hasAttribute("data-tab")) { setTab(el.getAttribute("data-tab")); return; }
  if (el.hasAttribute("data-day")) { ui.day = el.getAttribute("data-day"); saveUi(); renderDays(); return; }
  if (el.hasAttribute("data-goto-day")) { gotoDay(el.getAttribute("data-goto-day")); return; }
  if (el.hasAttribute("data-goto-item")) { gotoItem(el.getAttribute("data-goto-item")); return; }
  if (el.hasAttribute("data-goto-bk")) { gotoBooking(el.getAttribute("data-goto-bk")); return; }
  var a = el.getAttribute("data-act");
  if (a === "open-sheet") openSheet();
  else if (a === "close-sheet") closeSheet();
  else if (a === "get-data") getLatestData();
  else if (a === "export") exportBackup();
});
document.addEventListener("toggle", function(e){
  var d = e.target; if (d && d.tagName === "DETAILS" && d.dataset.id) { if (d.open) ui.open[d.dataset.id] = true; else delete ui.open[d.dataset.id]; }
}, true);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });
document.getElementById("import-file").addEventListener("change", function(e){ var f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ""; });

/* ---------- hash: #today #days #bookings #jetlag #todo, #sim-2026-11-08-1430 ---------- */
(function(){
  var h = (location.hash || "").slice(1);
  var m = /^sim-(\d{4})-(\d{2})-(\d{2})(?:-(\d{2})(\d{2}))?$/.exec(h);
  if (m) { sim = new Date(+m[1], +m[2]-1, +m[3], m[4]?+m[4]:12, m[5]?+m[5]:0); ui.tab = "today"; ui.day = null; }
  else if (["today","days","bookings","jetlag","todo"].indexOf(h) >= 0) ui.tab = h;
})();

renderAll();
setInterval(function(){ var c = document.getElementById("clocks"); if (c) c.innerHTML = clockBits(); }, 30000);
setInterval(function(){ if (pack && phase() === "during" && ui.tab === "today") renderToday(); }, 300000);

/* ---------- capabilities / offline ---------- */
if (BUILD === "artifact" && window.claude && window.claude.use) {
  window.claude.use("db").then(function(db){
    if (!db) return;
    dbRef = db.doc("trip/checks");
    dbRef.onSnapshot(function(snap){
      var remote = snap.exists ? ((snap.data() || {}).checks || {}) : {};
      checks = mergeChecks(checks, remote); syncMode = "account";
      lsSet(LS_CHECKS, JSON.stringify(checks));
      if (pack) { renderTabs(); renderToday(); renderDays(); renderTodo(); }
    }, function(){ dbRef = null; syncMode = "local"; if (pack) renderTodo(); });
  }, function(){});
}
if (BUILD === "offline" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(function(){ return navigator.serviceWorker.ready; }).then(function(){ swReady = true; }, function(){});
}
})();
</script>
